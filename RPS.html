<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPS GAME</title>
    <script type="module" src="./RPS.js" defer></script>
    <link rel="stylesheet" href="RPS.css">
</head>
<body>
    <h1 class="name">RPS</h1>
    <h3 class="subname">ROCK-PAPER-SCISSORS</h3>
    <input type="text" id="userInput" placeholder="Enter name">
<button id="submitBtn">Submit</button>

<script type="module">
  document.getElementById('submitBtn').addEventListener('click', () => {
    const name = document.getElementById('userInput').value;
    console.log(`Hello, ${name}!`);
  });
</script>
<div id="Icones">
    <div class="Tesoura">
        <img src="./Tesoura.png" alt="Scissors">

    </div>
    <div class="Papel">
        <img src="./Papel.png" alt="Papel">

    </div>
    <div class="Pedra">
        <img src="./Pedra.png" alt="Pedra">

    </div>
</div>
